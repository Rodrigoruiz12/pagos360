server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: ms-pagos
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres.luuftourpykupsbzusti}
    password: ${DB_PASSWORD:yIhXrNMuw2LEISsy}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 4000
  cloud:
    azure:
      active-directory:
        enabled: false

# Configuración de Negocio (Antifraude, Webpay Plus Integración y Kafka)
